<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhyIQ Next Step - {{DOMAIN}}</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-3">
  <section class="max-w-2xl mx-auto rounded-xl border border-[var(--border)] bg-[var(--card)] p-4 shadow-sm space-y-3">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <span class="text-xs font-mono uppercase tracking-wider text-[var(--muted-foreground)]">
        WhyIQ {{BADGE_LABEL}} &middot; {{DOMAIN}}
      </span>
      <span class="rounded-full border border-[var(--border)] bg-[var(--background)] px-2.5 py-0.5 text-xs font-medium text-[var(--foreground)]">
        {{TIER_LABEL}}
      </span>
    </div>

    <h2 class="text-base font-semibold text-[var(--foreground)] leading-snug">
      {{HEADLINE}}
    </h2>

    <p class="text-xs text-[var(--muted-foreground)] leading-relaxed">
      {{BODY_COPY}}
    </p>

    <div class="flex flex-wrap items-center gap-2 pt-1">
      <a
        href="{{PRIMARY_CTA_URL}}"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] px-3.5 py-2 text-xs font-semibold hover:opacity-90"
      >
        {{PRIMARY_CTA_LABEL}} &rarr;
      </a>
      <a
        href="https://www.whyiq.ai/dashboard/autopilot"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center rounded-lg border border-[var(--border)] bg-[var(--background)] px-3 py-2 text-xs font-semibold text-[var(--foreground)] hover:opacity-85"
      >
        Open WhyIQ Workspace &rarr;
      </a>
    </div>
  </section>
</body>
</html>
